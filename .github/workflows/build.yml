name: CI

# Every pull request and every push to main runs the tests only (no installer).
# A push to main whose Cargo.toml version has no v<version> tag yet also builds the MSI and publishes it
# as a GitHub Release (tag v<version>) with the matching CHANGELOG.md section as release notes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  version:
    name: Check version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this a new version?
        id: check
        run: |
          version=$(sed -nE 's/^version\s*=\s*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; bump the version in Cargo.toml to publish a release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$version: building the MSI and publishing a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build MSI and release
    needs: [test, version]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          $dir >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Publish release
        shell: bash
        run: |
          # Release notes: the CHANGELOG.md section of this version, without its heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Season Desktop $VERSION" > notes.md
          fi
          gh release create "v$VERSION" "dist/SeasonDesktop-$VERSION-x64.msi" \
            --target "$GITHUB_SHA" \
            --title "Season Desktop $VERSION" \
            --notes-file notes.md
