name: Build

# Every pull request and every push to main builds the MSI and uploads it as a workflow artifact.
# A push to main whose Cargo.toml version has no matching tag yet also publishes a GitHub Release
# (tag vX.Y.Z) with the MSI attached and the CHANGELOG.md entry as release notes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build MSI
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          $dir >> $env:GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SeasonDesktop-${{ steps.version.outputs.version }}-x64
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION already exists; bump the version in Cargo.toml to publish a release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false'
        with:
          name: SeasonDesktop-${{ env.VERSION }}-x64
          path: dist

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          # Release notes: the CHANGELOG.md section of this version, without its heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Season Desktop $VERSION" > notes.md
          fi
          gh release create "v$VERSION" dist/*.msi \
            --target "$GITHUB_SHA" \
            --title "Season Desktop $VERSION" \
            --notes-file notes.md
