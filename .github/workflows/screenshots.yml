name: Screenshots (temporary)

on:
  push:
    branches: [claude/hopeful-rubin-4p36dl]
    paths: [.github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Use Vietnam time zone
        run: tzutil /s "SE Asia Standard Time"
      - name: Build (fast release, unwinding panics for diagnostics)
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_PANIC: unwind
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: cargo build --release --locked
      - name: Render all themes
        continue-on-error: true
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          & ./target/release/season-desktop.exe --snapshot shots 2>&1 | Out-Host
          Write-Host "exit code: $LASTEXITCODE"
          Get-ChildItem shots | Format-Table Name, Length
      - name: Screenshot the running app (Full HD, Tet theme, themed taskbar)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Display {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern bool EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static int Set(int w, int h) {
              var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref dm);
              dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          "@
          Write-Host "resolution change: $([Display]::Set(1920, 1080))"
          Start-Sleep -Seconds 3
          $cfgDir = Join-Path $env:APPDATA "season-desktop"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          @'
          theme = "tet"
          taskbar_on = true
          taskbar_theme = "tet"

          [[monitors]]
          name = "\\\\.\\DISPLAY1"
          theme = "tet"
          wallpaper = true
          taskbar = true
          taskbar_theme = "tet"
          '@ | Set-Content -Encoding utf8 (Join-Path $cfgDir "config.toml")
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "saved $name ($($b.Width)x$($b.Height))"
          }
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 2
          Start-Process ./target/release/season-desktop.exe -ArgumentList "--minimized"
          Start-Sleep -Seconds 30
          Shot "desktop-tet"
          Start-Process ./target/release/season-desktop.exe
          Start-Sleep -Seconds 10
          Shot "settings-tet"
          Get-Content (Join-Path $cfgDir "log.txt") -ErrorAction SilentlyContinue | Select-Object -Last 40
          ./target/release/season-desktop.exe --restore
      - name: Push images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots
          git commit -m "tmp: rendered screenshots (2)"
          git push
