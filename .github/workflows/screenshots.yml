name: Screenshots (temporary)

on:
  push:
    branches: [claude/hopeful-rubin-4p36dl]
    paths: [.github/workflows/screenshots.yml]

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Use Vietnam time zone
        run: tzutil /s "SE Asia Standard Time"
      - name: Build (fast release)
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Render all themes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          ./target/release/season-desktop.exe --snapshot shots
          Get-ChildItem shots
      - name: Screenshot the running app
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process ./target/release/season-desktop.exe -PassThru
          Start-Sleep -Seconds 25
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/shots/desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Content "$env:APPDATA/season-desktop/log.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
          ./target/release/season-desktop.exe --restore
      - name: Push images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shots
          git commit -m "tmp: rendered screenshots"
          git push
